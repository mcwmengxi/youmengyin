server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # 根路径重定向到 /youmengyin/
    location = / {
        return 301 /youmengyin/;
    }

    # VitePress 应用路由（支持 base: '/youmengyin/'）
    location /youmengyin/ {
        alias /usr/share/nginx/html/youmengyin/;
        try_files $uri $uri/ /youmengyin/index.html;

        # 添加安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # 静态资源缓存（针对 /youmengyin/ 路径下的资源）
    location ~* ^/youmengyin/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 404 错误处理
    error_page 404 /youmengyin/404.html;

    # 50x 错误处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}